[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haystack-music"
version = "0.8.0"
description = "Personal Spotify music discovery driven by local-audio taste vectors"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
# certifi comes in through requests, unpinned. The floor is the first bundle without the
# compromised eMudhra CA (kurtlieber/dotfiles#338), so an existing venv upgrades on install.
dependencies = ["numpy>=2", "requests>=2.31", "mutagen>=1.47", "certifi>=2026.10.19"]

[project.optional-dependencies]
embed = ["essentia-tensorflow==2.1b6.dev1438"]
test = ["pytest>=8"]
llm = ["anthropic>=1.0,<2"]

[project.scripts]
haystack = "haystack_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
