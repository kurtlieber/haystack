# The server image. On a pull request that touches it: build it and check that it starts and loads Essentia.
# On a version tag (git tag v0.2.0 && git push origin v0.2.0): the same, then publish it to GitHub's container
# registry as ghcr.io/kurtlieber/haystack:0.2.0, :0.2 and :latest. linux/amd64 only (see Dockerfile).
name: image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/**
      - .github/workflows/image.yml
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=ci

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          img=ghcr.io/${{ github.repository }}:ci
          docker run --rm "$img" --help > /dev/null
          docker run --rm --entrypoint python "$img" -c "import essentia.standard; print('essentia ok')"
          docker run --rm "$img" models check || test $? -eq 1   # 1: models not fetched, as expected

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for t in $(echo "${{ steps.meta.outputs.tags }}" | grep -v ':ci$'); do
            docker push "$t"
          done
