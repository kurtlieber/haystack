# The server image. On a pull request that touches it: build it and check that it starts and loads Essentia.
# For a release: the same, then publish it to GitHub's container registry as ghcr.io/kurtlieber/haystack:0.2.0, :0.2
# and :latest, and start lieber.org's deploy so its haystack page shows the new version. haystack-release calls this
# with the tag it just made (ADR 0024); a version tag pushed by hand, or a run by hand with an existing tag, does the
# same. linux/amd64 only (see Dockerfile).
name: image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/**
      - .github/workflows/image.yml
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish (e.g. v0.10.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish (e.g. v0.9.0)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      # The release tag: the caller's or the run's input, or the pushed tag. Empty on a pull request: build, don't
      # publish.
      - id: t
        name: Release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ] && [[ $GITHUB_REF == refs/tags/v* ]]; then TAG=$GITHUB_REF_NAME; fi
          if [ -n "$TAG" ] && ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::not a release tag: $TAG"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.t.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.t.outputs.tag }},enable=${{ steps.t.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.t.outputs.tag }},enable=${{ steps.t.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.t.outputs.tag != '' }}
            type=raw,value=ci

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          img=ghcr.io/${{ github.repository }}:ci
          docker run --rm "$img" --help > /dev/null
          docker run --rm --entrypoint python "$img" -c "import essentia.standard; print('essentia ok')"
          docker run --rm "$img" models check || test $? -eq 1   # 1: models not fetched, as expected

      - name: Log in to ghcr.io
        if: steps.t.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.t.outputs.tag != ''
        run: |
          for t in $(echo "${{ steps.meta.outputs.tags }}" | grep -v ':ci$'); do
            docker push "$t"
          done

  # lieber.org shows haystack's newest tag. Once the image is out, starting its deploy saves waiting up to three hours
  # for its own check. LIEBER_ORG_DEPLOY_TOKEN can only start lieber.org's workflows; without it, the site catches up
  # on its own.
  site:
    needs: image
    if: needs.image.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.LIEBER_ORG_DEPLOY_TOKEN }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Start lieber.org's deploy
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::secret LIEBER_ORG_DEPLOY_TOKEN is not set; lieber.org shows $TAG within three hours"; exit 0; fi
          gh api -X POST repos/kurtlieber/lieber.org/actions/workflows/deploy.yml/dispatches -f ref=main
          echo "::notice::Started lieber.org's deploy"
